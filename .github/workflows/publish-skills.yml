name: Publish ARIA Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'orchestrator/oasf-record.json'
      - 'orchestrator/mcp-config.json'
      - 'agents/gateway-contract-drift-reviewer/oasf-record.json'
      - 'agents/gateway-contract-drift-reviewer/oasf-governance.json'
      - 'agents/gateway-contract-drift-reviewer/mcp-config.json'

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    name: Detect changed skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.changes.outputs.skills }}
      publishable_skills: ${{ steps.publishable.outputs.publishable_skills }}
      versions: ${{ steps.bump.outputs.versions }}
      bumped_skills: ${{ steps.bump.outputs.bumped_skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed skill directories
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-changed-skills.sh

      - name: Patch-bump skill versions
        id: bump
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.skills }}
          OUTPUT_KEY: versions
          BUMPED_OUTPUT_KEY: bumped_skills
        run: bash .github/scripts/bump-skill-version.sh

      - name: Commit version bumps
        if: steps.bump.outputs.bumped_skills != '[]'
        run: |
          set -euo pipefail
          if git diff --quiet -- skills/*/version.txt; then
            echo "No version.txt changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/*/version.txt
          git commit -m "ci: bump skill versions [skip ci]"
          git push origin HEAD:main

      - name: Filter publishable skills
        id: publishable
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.skills }}
          OUTPUT_KEY: publishable_skills
        run: bash .github/scripts/filter-publishable-skills.sh

  publish-skill:
    name: Publish ${{ matrix.skill }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.publishable_skills != '[]'
    permissions:
      id-token: write
      contents: read
      packages: write
    strategy:
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.publishable_skills) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install skill dependencies
        working-directory: skills/${{ matrix.skill }}
        run: npm install

      - name: Run skill tests with coverage baseline
        working-directory: skills/${{ matrix.skill }}
        run: npm test

      - name: Read OASF Record
        id: oasf
        env:
          SKILL_VERSION_MAP: ${{ needs.detect-changes.outputs.versions }}
        run: |
          VERSION=$(jq -r --arg skill "${{ matrix.skill }}" '.[$skill] // empty' <<< "$SKILL_VERSION_MAP")
          if [[ -z "$VERSION" ]]; then
            VERSION=$(jq -r '.version' skills/${{ matrix.skill }}/oasf-record.json)
          fi
          NAME=$(jq -r '.name' skills/${{ matrix.skill }}/oasf-record.json | tr '/' '-')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Validate OASF Record
        run: |
          node -e "
          const fs = require('fs');
          const record = JSON.parse(fs.readFileSync('skills/${{ matrix.skill }}/oasf-record.json'));
          const gov = JSON.parse(fs.readFileSync('skills/${{ matrix.skill }}/oasf-governance.json'));
          const required = ['name','version','schema_version','skills','locators','authors'];
          const missing = required.filter(f => !record[f]);
          if (missing.length) { console.error('Missing:', missing); process.exit(1); }
          const tiers = ['public','internal','confidential','highly_confidential','restricted'];
          const g = gov.governance;
          if (!tiers.includes(g.sensitivity_tier)) { console.error('Bad tier:', g.sensitivity_tier); process.exit(1); }
          if (tiers.indexOf(g.sensitivity_tier) > tiers.indexOf(g.dependency_sensitivity_ceiling)) {
            console.error('Ceiling violation'); process.exit(1);
          }
          console.log('✓ Validation passed:', record.name, 'v'+record.version);
          "

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI artifact
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aria-skills/${{ steps.oasf.outputs.name }}"
          TAG="${{ steps.oasf.outputs.version }}"
          cd skills/${{ matrix.skill }}
          AFFINITY_PAYLOAD="{}"
          if [[ -f model-affinity.json ]]; then
            AFFINITY_PAYLOAD="$(cat model-affinity.json)"
          fi
          AFFINITY_B64="$(printf '%s' "$AFFINITY_PAYLOAD" | base64 | tr -d '\n')"

          docker build \
            --label "aria.model.affinity=${AFFINITY_B64}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "Published ${IMAGE}:${TAG}"

      - name: Install MCP Publisher marketplace action
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate MCP Publisher marketplace action
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Server marketplace action
        working-directory: skills/${{ matrix.skill }}
        run: ../../mcp-publisher publish ./mcp-manifest.json

  publish-orchestrator:
    name: Publish orchestrator
    runs-on: ubuntu-latest
    needs: publish-skill
    if: ${{ always() && needs.publish-skill.result != 'failure' && needs.publish-skill.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read orchestrator version
        id: oasf
        run: |
          VERSION=$(jq -r '.version' orchestrator/oasf-record.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push orchestrator
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aria-skills/orchestrator"
          TAG="${{ steps.oasf.outputs.version }}"
          cd orchestrator
          echo "FROM scratch" > Dockerfile
          echo "COPY oasf-record.json /oasf-record.json" >> Dockerfile
          echo "COPY oasf-governance.json /oasf-governance.json" >> Dockerfile
          echo "COPY mcp-config.json /mcp-config.json" >> Dockerfile
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "Published ${IMAGE}:${TAG}"

  publish-gateway-contract-drift-reviewer:
    name: Publish gateway-contract-drift-reviewer
    runs-on: ubuntu-latest
    needs: publish-orchestrator
    if: ${{ always() && needs.publish-orchestrator.result != 'failure' && needs.publish-orchestrator.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read gateway-contract-drift-reviewer version
        id: oasf
        run: |
          VERSION=$(jq -r '.version' agents/gateway-contract-drift-reviewer/oasf-record.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate gateway-contract-drift-reviewer manifests
        run: |
          node -e "
          const fs = require('fs');
          const record = JSON.parse(fs.readFileSync('agents/gateway-contract-drift-reviewer/oasf-record.json'));
          const gov = JSON.parse(fs.readFileSync('agents/gateway-contract-drift-reviewer/oasf-governance.json'));
          const required = ['name','version','schema_version','skills','locators','authors','modules'];
          const missing = required.filter(f => !record[f]);
          if (missing.length) { console.error('Missing:', missing); process.exit(1); }
          const g = gov.governance;
          if (!g) { console.error('Missing governance block'); process.exit(1); }
          const tiers = ['public','internal','confidential','highly_confidential','restricted'];
          if (!tiers.includes(g.sensitivity_tier)) { console.error('Bad tier:', g.sensitivity_tier); process.exit(1); }
          if (!Array.isArray(g.allowed_consumers) || !g.allowed_consumers.includes('all-employees')) {
            console.error('Expected all-employees in allowed_consumers'); process.exit(1);
          }
          if (!Array.isArray(g.compliance_frameworks) || !g.compliance_frameworks.includes('SOC2')) {
            console.error('Expected SOC2 compliance framework'); process.exit(1);
          }
          console.log('✓ Validation passed:', record.name, 'v'+record.version);
          "

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push gateway-contract-drift-reviewer
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/agents/gateway-contract-drift-reviewer"
          TAG="${{ steps.oasf.outputs.version }}"
          cd agents/gateway-contract-drift-reviewer
          echo "FROM scratch" > Dockerfile
          echo "COPY oasf-record.json /oasf-record.json" >> Dockerfile
          echo "COPY oasf-governance.json /oasf-governance.json" >> Dockerfile
          echo "COPY mcp-config.json /mcp-config.json" >> Dockerfile
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "Published ${IMAGE}:${TAG}"
