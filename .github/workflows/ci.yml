name: ARIA Skills CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      all_skills:
        description: "Run evals for all skills with has_evals=true"
        required: false
        type: string
        default: "false"
      eval_model_matrix:
        description: "Optional JSON array override for eval model matrix"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  DEFAULT_EVAL_MODEL_MATRIX: >-
    [{"label":"claude-sonnet-4","provider":"anthropic:claude-sonnet-4"},{"label":"claude-haiku-4-5","provider":"anthropic:claude-haiku-4-5"},{"label":"gpt-4o","provider":"openai:gpt-4o"},{"label":"gpt-4o-mini","provider":"openai:gpt-4o-mini"},{"label":"azure-gpt-4o","provider":"azureopenai:gpt-4o"}]

jobs:
  skill-lint-oasf-validation:
    name: Skill lint & OASF validation gate
    runs-on: ubuntu-latest
    outputs:
      changed_skills: ${{ steps.changes.outputs.skills }}
      eval_skills: ${{ steps.eval_targets.outputs.eval_skills }}
      eval_models: ${{ steps.eval_models.outputs.eval_models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect changed skill directories
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL_SKILLS: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.all_skills == 'true') || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_ALL_SKILLS}" == "true" ]]; then
            all_skills="$(
              find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                | sort \
                | jq -R -s -c 'split("\n") | map(select(. != ""))'
            )"
            echo "skills=${all_skills}" >> "$GITHUB_OUTPUT"
            echo "$all_skills"
          else
            bash .github/scripts/detect-changed-skills.sh
          fi

      - name: Detect changed skills with enabled evals
        id: eval_targets
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.skills }}
          OUTPUT_KEY: eval_skills
        run: bash .github/scripts/detect-eval-targets.sh

      - name: Resolve eval model matrix
        id: eval_models
        env:
          DEFAULT_MATRIX: ${{ env.DEFAULT_EVAL_MODEL_MATRIX }}
          INPUT_MATRIX: ${{ github.event.inputs.eval_model_matrix || '' }}
        run: |
          set -euo pipefail
          models="${DEFAULT_MATRIX}"
          if [[ -n "${INPUT_MATRIX}" ]]; then
            models="${INPUT_MATRIX}"
          fi

          echo "$models" | jq -e 'if type != "array" then false else all(.[]; has("label") and has("provider")) end' >/dev/null
          echo "eval_models=${models}" >> "$GITHUB_OUTPUT"

      - name: Install validation dependencies
        if: steps.changes.outputs.skills != '[]'
        run: npm install --no-save ajv@8 ajv-formats@3

      - name: Lint changed SKILL.md required sections
        if: steps.changes.outputs.skills != '[]'
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.skills }}
        run: bash .github/scripts/lint-skill-markdown-sections.sh

      - name: Validate changed oasf-manifest.json schema
        if: steps.changes.outputs.skills != '[]'
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.skills }}
        run: node .github/scripts/validate-oasf-manifests.mjs

      - name: Warn when evals are missing
        if: steps.changes.outputs.skills != '[]'
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.skills }}
        run: bash .github/scripts/warn-missing-evals.sh

      - name: No changed skills to validate
        if: steps.changes.outputs.skills == '[]'
        run: echo "No changed skills detected in PR diff."

  skill-unit-evals:
    name: Skill unit evals (${{ matrix.skill }} / ${{ matrix.model.label }})
    runs-on: ubuntu-latest
    needs: [skill-lint-oasf-validation]
    if: ${{ needs.skill-lint-oasf-validation.result == 'success' && needs.skill-lint-oasf-validation.outputs.eval_skills != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.skill-lint-oasf-validation.outputs.eval_skills) }}
        model: ${{ fromJson(needs.skill-lint-oasf-validation.outputs.eval_models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve promptfoo config
        id: eval_config
        run: |
          set -euo pipefail
          skill="${{ matrix.skill }}"
          evals_dir="skills/${skill}/evals"
          config=""

          for candidate in \
            "${evals_dir}/promptfooconfig.yaml" \
            "${evals_dir}/promptfoo.yaml" \
            "${evals_dir}/promptfooconfig.yml" \
            "${evals_dir}/promptfoo.yml"; do
            if [[ -f "$candidate" ]]; then
              config="$candidate"
              break
            fi
          done

          if [[ -z "$config" ]]; then
            config="$(find "$evals_dir" -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.yml" \) | sort | head -n 1)"
          fi

          if [[ -z "$config" ]]; then
            echo "::error::No eval config file found under ${evals_dir}"
            exit 1
          fi

          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Run promptfoo unit eval
        uses: promptfoo/promptfoo-action@v2
        env:
          PROMPTFOO_EVAL_PROVIDER: ${{ matrix.model.provider }}
          PROMPTFOO_EVAL_MODEL_LABEL: ${{ matrix.model.label }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ steps.eval_config.outputs.config }}
          disable-comment: true
          fail-threshold: 80
          fail-on-threshold: 80
          repeat: 3
          min-pass-count: 2
          repeat-min-pass: 2

      - name: Collect eval results.json
        if: always()
        run: |
          set -euo pipefail
          skill="${{ matrix.skill }}"
          model="${{ matrix.model.label }}"
          target_dir="eval-results/${skill}/${model}"
          mkdir -p "$target_dir"

          source_file=""
          for candidate in \
            "skills/${skill}/evals/results.json" \
            "skills/${skill}/.promptfoo/latest.json" \
            ".promptfoo/latest.json"; do
            if [[ -f "$candidate" ]]; then
              source_file="$candidate"
              break
            fi
          done

          if [[ -z "$source_file" ]]; then
            source_file="$(find . -type f \( -name "results.json" -o -path "*/.promptfoo/latest.json" \) | head -n 1)"
          fi

          if [[ -z "$source_file" ]]; then
            jq -n '{"stats":{"total":1,"passed":0,"failures":1},"results":[{"pass":false,"error":"promptfoo results output missing"}]}' \
              > "${target_dir}/results.json"
            exit 0
          fi

          cp "$source_file" "${target_dir}/results.json"

      - name: Upload eval results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.skill }}-${{ matrix.model.label }}
          path: eval-results/${{ matrix.skill }}/${{ matrix.model.label }}
          retention-days: 30

  skill-unit-eval-summary:
    name: Skill unit eval summary comment
    runs-on: ubuntu-latest
    needs: [skill-lint-oasf-validation, skill-unit-evals]
    if: ${{ always() && needs.skill-lint-oasf-validation.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot committed model affinity baseline
        if: needs.skill-lint-oasf-validation.outputs.eval_skills != '[]' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          EVAL_SKILLS: ${{ needs.skill-lint-oasf-validation.outputs.eval_skills }}
        run: |
          set -euo pipefail
          mkdir -p model-affinity-baseline/skills
          while IFS= read -r skill; do
            [[ -z "$skill" ]] && continue
            source_path="skills/${skill}/model-affinity.json"
            if [[ -f "$source_path" ]]; then
              target_dir="model-affinity-baseline/skills/${skill}"
              mkdir -p "$target_dir"
              cp "$source_path" "${target_dir}/model-affinity.json"
            fi
          done < <(echo "${EVAL_SKILLS}" | jq -r '.[]')

      - name: Download eval result artifacts
        if: needs.skill-lint-oasf-validation.outputs.eval_skills != '[]'
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: eval-*
          path: eval-results
          merge-multiple: true

      - name: Build PR summary markdown
        if: needs.skill-lint-oasf-validation.outputs.eval_skills != '[]'
        env:
          EVAL_RESULTS_ROOT: eval-results
          EVAL_SUMMARY_MARKDOWN: eval-summary.md
          EVAL_SUMMARY_JSON: eval-summary.json
          EVAL_FAIL_THRESHOLD: "80"
        run: node .github/scripts/summarize-eval-results.mjs

      - name: Build skipped summary markdown
        if: needs.skill-lint-oasf-validation.outputs.eval_skills == '[]'
        run: |
          cat <<'EOF' > eval-summary.md
          <!-- unit-eval-summary -->
          ### Unit Eval Summary

          No changed skills matched `has_evals=true` with eval cases, so unit eval was skipped.
          EOF

      - name: Post PR comment with eval summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('eval-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- unit-eval-summary -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload eval summary artifact
        if: needs.skill-lint-oasf-validation.outputs.eval_skills != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: unit-eval-summary
          path: |
            eval-summary.md
            eval-summary.json
            skills/*/model-affinity.json
          retention-days: 30

      - name: Upload model affinity baseline artifact
        if: needs.skill-lint-oasf-validation.outputs.eval_skills != '[]' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: model-affinity-baseline
          path: model-affinity-baseline
          retention-days: 30

      - name: Commit model affinity snapshots to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.skill-lint-oasf-validation.outputs.eval_skills != '[]'
        run: |
          set -euo pipefail
          if git diff --quiet -- skills/*/model-affinity.json; then
            echo "No model-affinity changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/*/model-affinity.json
          git commit -m "ci: update model affinity snapshots [skip ci]"
          git push origin HEAD:main

  skill-model-drift-detection:
    name: Skill model drift detection
    runs-on: ubuntu-latest
    needs: [skill-lint-oasf-validation, skill-unit-eval-summary]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.skill-lint-oasf-validation.result == 'success' && needs.skill-lint-oasf-validation.outputs.eval_skills != '[]' && needs.skill-unit-eval-summary.result == 'success' }}
    env:
      HAS_DRIFT_TOKEN: ${{ secrets.ARIA_REPO_ISSUE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download current model affinity artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: unit-eval-summary
          path: eval-summary/current

      - name: Download committed model affinity baseline artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: model-affinity-baseline
          path: model-affinity-baseline

      - name: Detect model drift against committed baseline
        id: drift
        env:
          BASELINE_AFFINITY_ROOT: model-affinity-baseline/skills
          CURRENT_AFFINITY_ROOT: eval-summary/current/skills
          DRIFT_MAX_PASS_RATE_DROP: "3"
          DRIFT_REPORT_JSON: model-drift-report.json
          DRIFT_REPORT_MARKDOWN: model-drift-report.md
        run: node .github/scripts/detect-model-drift.mjs

      - name: Upload model drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-drift-report
          path: |
            model-drift-report.json
            model-drift-report.md
          retention-days: 30

      - name: Open cross-repo drift issue
        if: steps.drift.outputs.drift_detected == 'true' && env.HAS_DRIFT_TOKEN == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARIA_REPO_ISSUE_TOKEN }}
          script: |
            const fs = require("fs");
            const targetOwner = "aria-fx";
            const targetRepo = "aria";
            const report = JSON.parse(fs.readFileSync("model-drift-report.json", "utf8"));
            const reportMarkdown = fs.readFileSync("model-drift-report.md", "utf8");
            const marker = `<!-- model-drift-event:${report.eventKey} -->`;

            const title = `[Model Drift] ${report.affectedSkills.length} skill(s) changed in aria-skills`;
            const body = [
              marker,
              "## Automated Weekly Model Drift Detection",
              "",
              reportMarkdown,
              "",
              "### Recommended actions",
              "- Review `skills/<skill>/model-affinity.json` for each affected skill.",
              "- Re-run targeted promptfoo evals to confirm the drift signal.",
              "- If expected, update committed affinity baselines in `aria-fx/aria-skills`."
            ].join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: targetOwner,
              repo: targetRepo,
              state: "open",
              per_page: 100
            });

            const duplicate = openIssues.find((issue) => !issue.pull_request && issue.body?.includes(marker));
            if (duplicate) {
              core.info(`Existing drift issue found: #${duplicate.number} (${duplicate.html_url})`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: targetOwner,
              repo: targetRepo,
              title,
              body
            });
            core.info(`Created drift issue: ${created.data.html_url}`);

      - name: Warn when drift issue token is missing
        if: steps.drift.outputs.drift_detected == 'true' && env.HAS_DRIFT_TOKEN == 'false'
        run: echo "::warning::Detected drift but ARIA_REPO_ISSUE_TOKEN is not set; unable to create cross-repo issue."

  skill-unit-eval-regression-gate:
    name: Skill unit eval regression gate
    runs-on: ubuntu-latest
    needs: [skill-lint-oasf-validation, skill-unit-eval-summary]
    if: ${{ github.event_name == 'pull_request' && needs.skill-lint-oasf-validation.result == 'success' && needs.skill-lint-oasf-validation.outputs.eval_skills != '[]' && needs.skill-unit-eval-summary.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download current eval summary artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: unit-eval-summary
          path: eval-summary/current

      - name: Download latest successful main baseline artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          event: push
          workflow_conclusion: success
          name: unit-eval-summary
          path: eval-summary/baseline
          if_no_artifact_found: warn

      - name: Compare current eval summary to main baseline
        env:
          CURRENT_SUMMARY_PATH: eval-summary/current
          BASELINE_SUMMARY_PATH: eval-summary/baseline
          MAX_ALLOWED_DROP_POINTS: "5"
        run: node .github/scripts/compare-eval-summary.mjs

  repo-tests:
    name: Repository tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install

      - name: Run repository tests
        run: npm test

  skill-tests:
    name: Skill tests (${{ matrix.skill }})
    runs-on: ubuntu-latest
    needs: [skill-lint-oasf-validation]
    if: ${{ github.event_name != 'pull_request' || needs.skill-lint-oasf-validation.result == 'success' }}
    strategy:
      matrix:
        skill:
          - aria-skill-catalog
          - aria-skill-dependency-scan
          - aria-skill-publish
          - aria-skill-purview-sync
          - aria-skill-scaffold
          - aria-skill-validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install skill dependencies
        working-directory: skills/${{ matrix.skill }}
        run: npm install

      - name: Run skill tests
        working-directory: skills/${{ matrix.skill }}
        run: npm test
